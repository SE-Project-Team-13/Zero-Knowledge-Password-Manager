name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "karthik", "karthik2" ]
  pull_request:
    branches: [ "main", "karthik", "karthik2" ]

jobs:
  test-crypto:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Crypto Engine Tests
      run: npm test -w @password-manager/crypto-engine

  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Backend Tests
      run: npm test -w backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Build Crypto Engine
      run: npm run crypto:build
    - name: Run Frontend Tests
      run: npm test -w password-manager

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Lint Frontend
      working-directory: frontend
      run: node_modules/.bin/next lint || true
    - name: Lint Backend
      working-directory: backend
      run: npx eslint . --ext .ts || true

  deploy:
    name: Deploy to Render
    needs: [test-crypto, test-backend, test-frontend, code-quality]
    runs-on: ubuntu-latest
    # Only deploy on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Deploy Backend to Render
      run: |
        curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" \
          -o /dev/null -w "Backend deploy triggered: HTTP %{http_code}\n"

    - name: Deploy Frontend to Render
      if: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND != '' }}
      run: |
        curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" \
          -o /dev/null -w "Frontend deploy triggered: HTTP %{http_code}\n"

    - name: Deployment Summary
      run: echo "Deployment triggered for commit ${{ github.sha }}"
