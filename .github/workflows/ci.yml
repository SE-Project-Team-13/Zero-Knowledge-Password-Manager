name: CI Pipeline

on:
  push:
    branches: [ "main", "karthik", "karthik2" ]
  pull_request:
    branches: [ "main", "karthik", "karthik2" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Backend Tests
      run: npm test -w backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Build Crypto Engine
      run: npm run crypto:build
      
    - name: Run Frontend Tests
      run: npm test -w frontend
