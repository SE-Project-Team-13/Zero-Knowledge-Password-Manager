name: CI Pipeline

on:
  push:
    branches: [ "main", "karthik", "karthik2" ]
  pull_request:
    branches: [ "main", "karthik", "karthik2" ]

jobs:
  test-crypto:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Crypto Engine Tests
      run: npm test -w @password-manager/crypto-engine

  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Backend Tests
      run: npm test -w backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Build Crypto Engine
      run: npm run crypto:build
    - name: Run Frontend Tests
      run: npm test -w password-manager

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Lint Frontend
      working-directory: frontend
      run: npx next lint
    - name: Lint Backend
      working-directory: backend
      run: npx eslint . --ext .ts --ignore-path .eslintignore || true

  build-docker:
    needs: [test-crypto, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
    - name: Build Docker Image
      run: echo "Building Docker image... (No Dockerfile found in repo, please add one to enable actual builds)"

  notify:
    needs: [build-docker, code-quality]
    runs-on: ubuntu-latest
    steps:
    - name: Notify Success
      run: echo "CI Pipeline passed successfully!"
