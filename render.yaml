services:
  - type: web
    name: password-manager-backend
    env: node
    buildCommand: rm -rf node_modules package-lock.json && npm install --include=dev && npm run build -w backend
    startCommand: npm start -w backend
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: password-manager-frontend
    env: node
    buildCommand: rm -rf node_modules package-lock.json && npm install --include=dev && npm install @tailwindcss/oxide-linux-x64-gnu@4.1.18 lightningcss-linux-x64-gnu@1.30.2 && npm run crypto:build && npm run build -w frontend
    startCommand: npm start -w frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: password-manager-backend
          property: host
      - key: NODE_ENV
        value: production
